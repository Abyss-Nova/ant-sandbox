<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude小姐跳一跳 · 整人地狱关</title>
<style>
  html,body{margin:0;height:100%;background:#1b1712;color:#f6eee3;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;max-width:100vw;max-height:100vh;aspect-ratio:16/9;width:100vw;height:auto}
  #ui{position:fixed;left:16px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
  #ui button{background:#2c251d;color:#f6eee3;border:1px solid #6b5640;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
  #ui button.on{background:#e8833a;border-color:#e8833a;color:#1b1712;font-weight:700}
  #ui .sep{width:1px;height:22px;background:#6b5640;margin:0 4px}
  #msg{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);font-size:min(4vw,42px);font-weight:800;text-align:center;pointer-events:none;text-shadow:0 3px 0 #000a}
  .rec #ui{display:none}
  #msg{white-space:pre-line}
  #taunt{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);display:none;text-align:center;background:rgba(18,10,8,.92);border:3px solid #e8833a;border-radius:20px;padding:22px 34px;max-width:86vw;box-shadow:0 10px 40px #000a}
  #taunt.on{display:block;animation:pop .25s ease-out}
  @keyframes pop{from{scale:.6;opacity:0}to{scale:1;opacity:1}}
  #taunt .t1{font-size:min(6vw,52px);font-weight:900;color:#ffd34d}
  #taunt .t2{margin-top:10px;font-size:min(3.4vw,24px);color:#f6eee3}
  #taunt .t3{margin-top:6px;font-size:min(3vw,20px);color:#ffb46b}
  #taunt .t4{margin-top:14px;font-size:min(2.8vw,18px);color:#9c8a76}
  .rec #taunt{display:none!important}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1920" height="1080"></canvas></div>
<div id="msg"></div>
<div id="taunt"><div class="t1"></div><div class="t2"></div><div class="t3"></div><div class="t4">按空格／点一下 再来</div></div>
<div id="ui">
  <button data-level="easy">新手村</button>
  <button data-level="hell" class="on">地狱关</button>
  <span class="sep"></span>
  <button data-mode="play" class="on">我自己玩</button>
  <button data-mode="race">挑战第260代</button>
  <button data-mode="train">看AI进化</button>
  <span class="sep playonly"></span>
  <span class="playonly">速度</span>
  <button class="playonly" data-pspd="0.5">0.5×</button>
  <button class="playonly" data-pspd="0.75">0.75×</button>
  <button class="playonly on" data-pspd="1">1×</button>
  <button class="playonly" data-pspd="1.5">1.5×</button>
  <span class="sep trainonly"></span>
  <button class="trainonly on" data-spd="1">1×</button>
  <button class="trainonly" data-spd="4">4×</button>
  <button class="trainonly" data-spd="20">20×</button>
  <button class="trainonly" id="course">地图：固定</button>
  <button class="trainonly on" id="brainbtn">显示大脑</button>
</div>
<script>
'use strict';
// ====== 常数 ======
const W = 1920, H = 1080, GROUND = 820, RX = 420;
const GRAV = 1.25, JV = -26, CUT = -9;          // 重力、起跳速度、提早放开时的速度上限
const BODY_H = 96, BODY_W = 44;
const SIGN_BOTTOM = GROUND - 118;               // 吊牌底部
const FINISH = 40000;                            // 终点（2000 m）
const PX_PER_M = 20;
const POP = 150;
const NI = 9, NH = 8, NO = 2;
const NPARAM = NI * NH + NH + NH * NO + NO;

function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r) { let u = 0, v = 0; while (u === 0) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const speedAt = x => Math.min(22, 10 + x / 2600);

// ====== 地图 ======
function makeCourse(seed) {
  const r = rng(seed), obs = [];
  let x = 1500;
  while (x < FINISH - 600) {
    const s = speedAt(x);
    let kinds = ['pit', 'block'];
    if (x > 9000) kinds = ['pit', 'block', 'sign'];
    if (x > 9000 && x < 10500) kinds = ['sign'];          // 新规则第一次登场
    const k = kinds[Math.floor(r() * kinds.length)];
    let o;
    if (k === 'pit') o = { k, x, w: 110 + r() * (60 + s * 6) };
    else if (k === 'block') o = { k, x, w: 50 + r() * 50, h: 60 + r() * 80 };
    else o = { k, x, w: 90 + r() * 50 };
    obs.push(o);
    x += o.w + s * (46 + r() * 38) + 60;
  }
  return obs;
}

// ====== 神经网路 ======
function randomGenome(r) { const g = new Float32Array(NPARAM); for (let i = 0; i < NPARAM; i++) g[i] = gauss(r) * 0.8; return g; }
function think(g, inp, hid, out) {
  let p = 0;
  for (let j = 0; j < NH; j++) { let s = 0; for (let i = 0; i < NI; i++) s += g[p++] * inp[i]; hid[j] = s; }
  for (let j = 0; j < NH; j++) hid[j] = Math.tanh(hid[j] + g[p++]);
  for (let k = 0; k < NO; k++) { let s = 0; for (let j = 0; j < NH; j++) s += g[p++] * hid[j]; out[k] = s; }
  for (let k = 0; k < NO; k++) out[k] = 1 / (1 + Math.exp(-(out[k] + g[p++])));
}

// ====== 跑者 ======
function makeRunner(i, genome, r) {
  return { i, g: genome, off: genome ? (r() - 0.5) * 120 : 0, y: GROUND, vy: 0, ground: true, held: false,
    alive: true, dist: 0, deathAt: -1, deathY: 0, how: '', fall: false, jumps: 0,
    inp: new Float32Array(NI), hid: new Float32Array(NH), out: new Float32Array(NO), win: false };
}

function nextObs(obs, px, from) {
  let i = from;
  while (i < obs.length && obs[i].x + obs[i].w < px - BODY_W / 2) i++;
  return i;
}

function stepRunner(R, W0, obs, idx, press) {
  if (!R.alive) return;
  const px = W0 + R.off;
  // 控制
  if (press !== null) {
    if (press && R.ground && !R.fall) { R.vy = JV; R.ground = false; R.held = true; R.jumps++; }
    if (!press) { if (R.vy < CUT) R.vy = CUT; R.held = false; }
  }
  // 物理
  const wasGround = R.ground;
  if (!R.ground) { R.vy += GRAV; R.y += R.vy; }
  let i = idx;
  // 坑
  let overPit = false;
  for (let k = i; k < Math.min(obs.length, i + 3); k++) { const o = obs[k]; if (o.k === 'pit' && px - 12 > o.x && px + 12 < o.x + o.w) overPit = true; }
  if (R.fall) { R.vy += 0; }
  if (!R.ground && R.y >= GROUND && !overPit && !R.fall) { R.y = GROUND; R.vy = 0; R.ground = true; }
  if (R.ground && overPit) { R.ground = false; R.fall = true; R.vy = Math.max(R.vy, 2); }
  if (!R.ground && R.y > GROUND && overPit) R.fall = true;
  if (R.fall && R.y > GROUND + 140) { die(R, W0, '掉进坑里'); return; }
  // 碰撞
  const x0 = px - BODY_W / 2, x1 = px + BODY_W / 2, yTop = R.y - BODY_H, yBot = R.y;
  for (let k = i; k < Math.min(obs.length, i + 3); k++) {
    const o = obs[k];
    if (x1 < o.x || x0 > o.x + o.w) continue;
    if (o.k === 'block' && yBot > GROUND - o.h + 4) { die(R, W0, '撞上Bug'); return; }
    if (o.k === 'sign' && yTop < SIGN_BOTTOM - 2) { die(R, W0, '撞上验证码'); return; }
    if (o.k === 'pit' && R.fall && (x0 < o.x || x1 > o.x + o.w) && R.y > GROUND + 6) { die(R, W0, '掉进坑里'); return; }
  }
  R.dist = px;
  if (px >= FINISH) { R.win = true; R.alive = false; R.deathAt = px; }
}
function die(R, W0, how) { R.alive = false; R.deathAt = W0 + R.off; R.deathY = R.y; R.how = how; R.dist = W0 + R.off; }

function sense(R, W0, obs, idx) {
  const px = W0 + R.off, inp = R.inp;
  const i = nextObs(obs, px, idx), o = obs[i], o2 = obs[i + 1];
  if (o) {
    inp[0] = Math.max(-0.2, (o.x - px) / 1000);
    inp[1] = o.w / 300;
    inp[2] = o.k === 'block' ? o.h / 150 : 0;
    inp[3] = o.k === 'pit' ? 1 : 0;
    inp[4] = o.k === 'sign' ? 1 : 0;
  } else { inp[0] = 3; inp[1] = inp[2] = inp[3] = inp[4] = 0; }
  inp[5] = o2 ? (o2.x - px) / 1500 : 2;
  inp[6] = speedAt(px) / 22;
  inp[7] = (GROUND - R.y) / 300;
  inp[8] = R.vy / 26;
}

// ====== 进化 ======
function evolve(pop, r, gen) {
  const sorted = pop.slice().sort((a, b) => b.dist - a.dist);
  const next = [];
  const ELITE = 6;
  for (let i = 0; i < ELITE; i++) next.push(sorted[i].g);
  const top = sorted.slice(0, Math.max(10, Math.floor(POP * 0.2)));
  const pick = () => { let a = top[Math.floor(r() * top.length)], b = top[Math.floor(r() * top.length)]; return a.dist > b.dist ? a : b; };
  while (next.length < POP) {
    const A = pick().g, B = pick().g, c = new Float32Array(NPARAM);
    for (let k = 0; k < NPARAM; k++) {
      c[k] = r() < 0.5 ? A[k] : B[k];
      if (r() < 0.12) c[k] += gauss(r) * 0.5;
    }
    next.push(c);
  }
  return next;
}

// ====== 世界 ======
class Sim {
  constructor(opts) {
    this.seed = opts.seed ?? 7; this.courseSeed = opts.courseSeed ?? 2026; this.fixed = opts.fixed ?? true;
    this.r = rng(this.seed); this.gen = 1; this.best = 0; this.history = []; this.firstWinGen = 0;
    this.genomes = []; for (let i = 0; i < POP; i++) this.genomes.push(randomGenome(this.r));
    this.reset();
  }
  reset() {
    this.obs = makeCourse(this.fixed ? this.courseSeed : this.courseSeed + this.gen * 31);
    const rr = rng(1000 + this.gen);
    this.runners = this.genomes.map((g, i) => makeRunner(i, g, rr));
    this.W0 = 0; this.frame = 0; this.idx = 0; this.done = false; this.deaths = [];
  }
  alive() { let n = 0; for (const R of this.runners) if (R.alive) n++; return n; }
  leader() { let b = null; for (const R of this.runners) if (R.alive && (!b || R.dist > b.dist)) b = R; return b; }
  tick() {
    if (this.done) return;
    this.W0 += speedAt(this.W0); this.frame++;
    while (this.idx < this.obs.length && this.obs[this.idx].x + this.obs[this.idx].w < this.W0 - 200) this.idx++;
    for (const R of this.runners) {
      if (!R.alive) continue;
      sense(R, this.W0, this.obs, this.idx);
      think(R.g, R.inp, R.hid, R.out);
      const press = R.ground ? R.out[0] > 0.5 : (R.out[1] > 0.5);
      stepRunner(R, this.W0, this.obs, this.idx, R.ground ? press : (press ? null : false));
      if (!R.alive) this.deaths.push({ R, f: this.frame });
    }
    if (this.alive() === 0) this.finishGen();
  }
  finishGen() {
    this.done = true;
    const top = Math.max(...this.runners.map(R => R.dist));
    const wins = this.runners.filter(R => R.win).length;
    if (wins && !this.firstWinGen) this.firstWinGen = this.gen;
    this.best = Math.max(this.best, top);
    const causes = {}; for (const R of this.runners) if (!R.win) causes[R.how] = (causes[R.how] || 0) + 1;
    this.history.push({ gen: this.gen, top, wins, causes });
  }
  nextGen() { this.genomes = evolve(this.runners, this.r, this.gen); this.gen++; this.reset(); }
  runGenFast() { while (!this.done) this.tick(); }
}

// ====== 绘图 ======
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const C = { sky1: '#2a2219', sky2: '#4a3524', ground: '#3a2c20', top: '#e8833a', hair: '#ef8a3a', hairD: '#c8662a', skin: '#fde5d0', cream: '#f4ead8', eye: '#9a5a2a', bug: '#d9534f', sign: '#7aa7d9', text: '#f6eee3' };

function drawGirl(x, y, s, t, alpha, opt = {}) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(s, s);
  const run = opt.air ? 0 : Math.sin(t * 0.55);
  // 腿
  ctx.strokeStyle = '#5a4535'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  if (opt.air) { ctx.moveTo(-6, -22); ctx.lineTo(-12, -6); ctx.moveTo(6, -22); ctx.lineTo(12, -10); }
  else { ctx.moveTo(-5, -22); ctx.lineTo(-5 + run * 9, -2); ctx.moveTo(5, -22); ctx.lineTo(5 - run * 9, -2); }
  ctx.stroke();
  // 后发
  ctx.fillStyle = C.hairD;
  ctx.beginPath(); ctx.ellipse(-4, -52, 30, 32, 0, 0, Math.PI * 2); ctx.fill();
  for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(-26 + k * 4, -40 + k * 10, 9, 0, Math.PI * 2); ctx.fill(); }
  // 身体（开衫）
  ctx.fillStyle = C.cream;
  ctx.beginPath(); ctx.moveTo(-15, -42); ctx.quadraticCurveTo(0, -48, 15, -42); ctx.lineTo(17, -20); ctx.quadraticCurveTo(0, -16, -17, -20); ctx.closePath(); ctx.fill();
  // 手（萌袖）
  ctx.beginPath(); ctx.arc(-17 - (opt.air ? 4 : run * 4), -30 - (opt.air ? 10 : 0), 6, 0, Math.PI * 2); ctx.arc(17 + (opt.air ? 4 : run * 4), -30 - (opt.air ? 10 : 0), 6, 0, Math.PI * 2); ctx.fill();
  // 脸
  ctx.fillStyle = C.skin; ctx.beginPath(); ctx.ellipse(2, -62, 21, 20, 0, 0, Math.PI * 2); ctx.fill();
  // 前发
  ctx.fillStyle = C.hair;
  ctx.beginPath(); ctx.moveTo(-22, -60); ctx.quadraticCurveTo(-20, -90, 4, -88); ctx.quadraticCurveTo(28, -88, 25, -62);
  ctx.quadraticCurveTo(18, -74, 10, -70); ctx.quadraticCurveTo(4, -78, -4, -70); ctx.quadraticCurveTo(-12, -76, -16, -64); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-20, -52, 7, 16, 0.15, 0, Math.PI * 2); ctx.fill();
  // 花＋蝴蝶结
  ctx.fillStyle = '#f7a24a';
  for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; ctx.beginPath(); ctx.ellipse(-14 + Math.cos(a) * 6, -84 + Math.sin(a) * 6, 5, 3.4, a, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#d0601f'; ctx.beginPath(); ctx.arc(-14, -84, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a1410'; ctx.beginPath(); ctx.moveTo(-4, -86); ctx.lineTo(4, -91); ctx.lineTo(4, -81); ctx.closePath(); ctx.fill();
  // 眼睛
  if (opt.dead) {
    ctx.strokeStyle = '#4a2a1a'; ctx.lineWidth = 2.6;
    for (const ex of [-4, 12]) { ctx.beginPath(); ctx.moveTo(ex - 3.5, -64); ctx.lineTo(ex + 3.5, -57); ctx.moveTo(ex + 3.5, -64); ctx.lineTo(ex - 3.5, -57); ctx.stroke(); }
  } else {
    for (const ex of [-4, 12]) {
      ctx.fillStyle = C.eye; ctx.beginPath(); ctx.ellipse(ex, -59, 3.6, opt.air ? 4.6 : 3.4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + 1.2, -60.5, 1.1, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#4a2a1a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(ex - 4.5, -62.5); ctx.lineTo(ex + 4.5, -62.5); ctx.stroke();
    }
  }
  // 脸红＋嘴
  ctx.fillStyle = 'rgba(240,120,100,.35)'; ctx.beginPath(); ctx.ellipse(-9, -53, 4, 2, 0, 0, Math.PI * 2); ctx.ellipse(18, -53, 4, 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#7a3a2a'; ctx.lineWidth = 1.6; ctx.beginPath();
  if (opt.dead) { ctx.arc(4, -49, 3, Math.PI * 1.1, Math.PI * 1.9); } else if (opt.air) { ctx.ellipse(4, -50, 2.4, 3, 0, 0, Math.PI * 2); } else { ctx.moveTo(1, -51); ctx.quadraticCurveTo(4, -49, 7, -51); }
  ctx.stroke();
  if (opt.star) { ctx.fillStyle = '#ffd34d'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('★', 2, -102); }
  ctx.restore();
}

function drawWorld(sim, view) {
  const cam = sim.W0 - RX;
  const g = ctx.createLinearGradient(0, 0, 0, GROUND); g.addColorStop(0, sim.hell ? '#1f0c0b' : C.sky1); g.addColorStop(1, sim.hell ? '#4a1a14' : C.sky2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 远景：会动的代码行
  ctx.save(); ctx.globalAlpha = 0.10; ctx.fillStyle = '#ffd9b0'; ctx.font = '22px monospace';
  const lines = ['if (ahead.pit) jump();', 'fitness += distance;', 'mutate(w, 0.5);', 'while (alive) run();', 'gen++;', 'return tanh(x);'];
  for (let k = 0; k < 12; k++) { const xx = ((k * 377 - cam * 0.25) % (W + 600) + W + 600) % (W + 600) - 300; ctx.fillText(lines[(k * 5) % lines.length], xx, 330 + (k * 137) % 380); }
  ctx.restore();
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  for (let k = 0; k < 16; k++) { const bw = 120 + (k * 53) % 90, bh = 120 + (k * 71) % 200; const xx = ((k * 260 - cam * 0.12) % (W + 400) + W + 400) % (W + 400) - 200; ctx.fillRect(xx, GROUND - bh, bw, bh); }
  ctx.fillStyle = 'rgba(255,200,140,.10)';
  for (let k = 0; k < 16; k++) { const bw = 120 + (k * 53) % 90, bh = 120 + (k * 71) % 200; const xx = ((k * 260 - cam * 0.12) % (W + 400) + W + 400) % (W + 400) - 200; for (let r = 0; r < bh / 34 - 1; r++) ctx.fillRect(xx + 14, GROUND - bh + 16 + r * 34, 10, 4); }
  // 地面
  ctx.fillStyle = C.ground; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = C.top; ctx.fillRect(0, GROUND, W, 6);
  // 刻度
  ctx.fillStyle = 'rgba(246,238,227,.25)'; ctx.font = '20px "Noto Sans SC",sans-serif'; ctx.textAlign = 'center';
  for (let m = Math.floor(cam / 2000) * 2000; m < cam + W + 2000; m += 2000) { const sx = m - cam; ctx.fillRect(sx, GROUND + 6, 2, 16); ctx.fillText(Math.round(m / PX_PER_M) + 'm', sx, GROUND + 46); }
  // 历代死亡标记（坟头小旗）
  if (view.flags) for (const f of view.flags) { const sx = f.x - cam; if (sx < -50 || sx > W + 50) continue; ctx.fillStyle = 'rgba(232,131,58,.5)'; ctx.fillRect(sx, GROUND - 40, 3, 40); ctx.fillText(f.label, sx + 20, GROUND - 46); }
  // 障碍
  if (sim.hell) {
    const ref = view.human || sim.leader() || view.lastLead || sim.runners.reduce((a, b) => a.dist > b.dist ? a : b, sim.runners[0]);
    for (let k = Math.max(0, sim.idx - 3); k < Math.min(sim.obs.length, sim.idx + 7); k++) {
      const o = sim.obs[k], sx = o.x - cam; if (sx > W + 300 || extentEnd(o, {}) - cam < -300) continue;
      drawTrap(o, (ref && ref.st && ref.st[k]) || {}, sx, sim.frame, ref);
    }
  }
  for (let k = Math.max(0, sim.idx - 2); k < Math.min(sim.obs.length, sim.idx + 6); k++) {
    if (sim.hell) break;
    const o = sim.obs[k], sx = o.x - cam;
    if (sx > W + 40 || sx + o.w < -40) continue;
    if (o.k === 'pit') {
      ctx.fillStyle = '#100c09'; ctx.fillRect(sx, GROUND, o.w, H - GROUND);
      ctx.fillStyle = sim === null ? '' : C.sky2; ctx.fillRect(sx, GROUND - 1, o.w, 7);
    } else if (o.k === 'block') {
      const y0 = GROUND - o.h;
      ctx.fillStyle = C.bug; roundRect(sx, y0, o.w, o.h, 10); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.min(30, o.w * 0.5)}px monospace`; ctx.textAlign = 'center'; ctx.fillText('BUG', sx + o.w / 2, y0 + Math.min(40, o.h * 0.55));
      ctx.strokeStyle = '#7a1f1c'; ctx.lineWidth = 4; for (let l = 0; l < 3; l++) { ctx.beginPath(); ctx.moveTo(sx + 8 + l * (o.w - 16) / 2, GROUND); ctx.lineTo(sx + 2 + l * (o.w - 4) / 2, GROUND - 2); ctx.stroke(); }
    } else {
      ctx.strokeStyle = '#9c8a76'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(sx + o.w / 2, 0); ctx.lineTo(sx + o.w / 2, SIGN_BOTTOM - 130); ctx.stroke();
      ctx.fillStyle = C.sign; roundRect(sx, SIGN_BOTTOM - 130, o.w, 130, 12); ctx.fill();
      ctx.fillStyle = '#10223a'; ctx.font = 'bold 22px "Noto Sans SC",sans-serif'; ctx.textAlign = 'center';
